{% extends 'base.html' %}

{% block title %}{{ tool.title }} - Free Online PDF Tool{% endblock %}

{% block content %}
<div class="tool-workspace">
    <h2><i class="fa-solid {{ tool.icon }}"></i> {{ tool.title }}</h2>
    <p>{{ tool.desc }}</p>

    <form action="/process/{{ tool_name }}/" method="POST" enctype="multipart/form-data" class="upload-box">
        {% csrf_token %}
        
        <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
        <h3>Select files</h3>
        <p>Click below to choose your files</p>
        
        <!-- Mobile friendly file input -->
        <input type="file" name="pdf_files" multiple required 
               style="display: block; margin: 20px auto; padding: 12px; width: 90%; max-width: 300px; font-size: 16px;">
        
        <br>
        <button type="submit" class="btn-primary" style="margin-top: 15px; padding: 14px 30px; font-size: 16px;">
            Execute {{ tool.title }}
        </button>
    </form>
</div>
{% endblock %}
